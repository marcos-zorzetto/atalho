# Robô semanal de atualização da documentação.
#
# 1. Compara os recursos usados nos componentes com o web-features
#    (base oficial dos selos Baseline do MDN) e confere os links do MDN.
# 2. Se algo mudou e houver uma credencial do Claude, ele lê o relatório e
#    ajusta componentes, exemplos e textos.
# 3. Os testes rodam e um pull request é aberto para revisão humana.
#    Nada vai para o ar sem alguém aprovar o PR.
#
# O robô nunca quebra por causa da IA: sem credencial, sem crédito, fora do ar
# ou com testes falhando, as mudanças da IA são descartadas e o PR é aberto
# só com os dados oficiais e o relatório.
#
# Credencial (use UMA das duas, em Settings → Secrets and variables → Actions):
# - CLAUDE_CODE_OAUTH_TOKEN: usa sua assinatura Claude Pro/Max, sem custo extra.
#   Gere com o comando "claude setup-token" no terminal.
# - ANTHROPIC_API_KEY: chave da API (console.anthropic.com), crédito pré-pago.

name: Atualizar documentação

on:
  schedule:
    - cron: "0 9 * * 1" # toda segunda-feira, 6h no horário de Brasília
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: atualizar-documentacao
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TEM_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Verificar suporte dos navegadores e links do MDN
        id: verificar
        run: node scripts/atualizar-documentacao.mjs --links --relatorio "$RUNNER_TEMP/relatorio.md"

      - name: Claude revisa os componentes afetados
        id: claude
        if: steps.verificar.outputs.mudou == 'true' && env.TEM_CLAUDE == 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Você mantém o Atalho, uma biblioteca de componentes de interface em português
            para iniciantes. Leia o relatório em ${{ runner.temp }}/relatorio.md e faça as
            mudanças necessárias:

            - Recurso que passou a "amplo" ou "recente": se o componente tinha um contorno
              ou aviso por falta de suporte, simplifique. Se o recurso permite um jeito mais
              simples de fazer algo (ex.: algo que antes exigia JavaScript), atualize o
              exemplo e o texto "comoFunciona".
            - Recurso que regrediu ou ficou "desconhecido": procure o id novo em
              https://unpkg.com/web-features/data.json e corrija o campo "recursos".
            - Link quebrado: encontre a página nova no MDN e troque o link.
            - Página que ganhou tradução: troque en(...) por pt(...) no link.

            Regras:
            - Os dados ficam em site/dados/*.js; o código da biblioteca em atalho/.
            - Escreva em português do Brasil, com o mesmo tom dos textos existentes.
            - Não mude a API pública (nomes de classes e atributos) sem necessidade.
            - Não edite site/dados/baseline.js: ele é gerado pelo script.
            - Rode `npm test` no final; todos os testes precisam passar.
            - Não faça commit nem push: o próximo passo abre o pull request.
          claude_args: |
            --max-turns 40
            --allowedTools "Read,Edit,Write,Glob,Grep,WebFetch,Bash(npm test),Bash(node:*)"

      - name: Rodar testes
        id: testes
        if: steps.verificar.outputs.mudou == 'true'
        continue-on-error: true
        run: npm test

      # Se a IA falhou (sem crédito, fora do ar...) ou deixou os testes quebrados,
      # descarta as mudanças dela e mantém só os dados oficiais atualizados.
      - name: Descartar mudanças da IA se algo deu errado
        if: steps.verificar.outputs.mudou == 'true' && (steps.claude.outcome == 'failure' || steps.testes.outcome == 'failure')
        run: |
          git diff --name-only | grep -v '^site/dados/baseline.js$' | xargs -r git checkout --
          git clean -fd
          npm test
          {
            echo ""
            echo "## Observação do robô"
            echo ""
            if [ "${{ steps.claude.outcome }}" = "failure" ]; then
              echo "A revisão pelo Claude não rodou (credencial sem crédito, expirada ou serviço fora do ar). Este PR traz só os dados oficiais atualizados; ajuste os componentes manualmente se precisar."
            else
              echo "As mudanças sugeridas pelo Claude não passaram nos testes e foram descartadas. Este PR traz só os dados oficiais atualizados."
            fi
          } >> "$RUNNER_TEMP/relatorio.md"

      - name: Avisar quando não há credencial do Claude
        if: steps.verificar.outputs.mudou == 'true' && env.TEM_CLAUDE != 'true'
        run: |
          {
            echo ""
            echo "## Observação do robô"
            echo ""
            echo "Nenhuma credencial do Claude configurada: os componentes não foram revisados automaticamente."
          } >> "$RUNNER_TEMP/relatorio.md"

      - name: Abrir pull request
        if: steps.verificar.outputs.mudou == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: robo/atualizacao-documentacao
          delete-branch: true
          commit-message: "docs: atualização semanal de suporte dos navegadores e links do MDN"
          title: "Atualização semanal da documentação"
          body-path: ${{ runner.temp }}/relatorio.md
          labels: documentação, robô
