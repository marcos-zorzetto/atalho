# Gera o site (dist/) e publica.
# Roda a cada push na main e toda segunda-feira (para tirar do ar patrocínios vencidos).
#
# Onde publicar é decidido por duas variáveis do repositório
# (Settings → Secrets and variables → Actions → Variables):
#   ATALHO_URL         endereço oficial, ex.: https://atalho.com.pt/ (vazio: GitHub Pages padrão)
#   ATALHO_HOSPEDAGEM  "github" (padrão), "ptservidor" ou "cloudflare"
# Na PTServidor e na Cloudflare, o GitHub Pages não é usado (está desativado no repositório
# desde 16/10/2026; o endereço antigo deixou de existir). Guias: servicos/PTSERVIDOR.md e servicos/MIGRAR-DOMINIO.md

name: Publicar site

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 10 * * 1"
  workflow_dispatch:

permissions:
  contents: write # para guardar o site gerado no ramo ptservidor-site
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  ATALHO_URL: ${{ vars.ATALHO_URL }}
  ATALHO_HOSPEDAGEM: ${{ vars.ATALHO_HOSPEDAGEM || 'github' }}
  # Os segredos não podem ir num 'if:'; daqui fica só a saber se existe
  FTP_SERVIDOR: ${{ secrets.FTP_SERVIDOR }}

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: ${{ (vars.ATALHO_HOSPEDAGEM || 'github') == 'github' && 'github-pages' || 'producao' }}
      url: ${{ vars.ATALHO_URL || steps.publicacao.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci

      - name: Testes (não publica nada quebrado)
        run: npm test

      - name: Gerar o site
        run: node scripts/gerar-site.mjs

      # PTServidor (cPanel), sem palavras-passe: o site gerado fica no ramo ptservidor-site e uma
      # tarefa cron no cPanel (~/publicar-atalho.sh) vai buscá-lo de 10 em 10 minutos.
      - name: Guardar o site no ramo ptservidor-site
        if: env.ATALHO_HOSPEDAGEM == 'ptservidor'
        env:
          TOKEN: ${{ github.token }}
        run: |
          cp -r dist /tmp/site && cd /tmp/site
          git init -q -b ptservidor-site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Site gerado a partir de ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ptservidor-site

      # PTServidor (cPanel), alternativa: envia o dist/ por FTPS com o lftp do Ubuntu (sem ações de terceiros).
      # Só corre se os segredos existirem; sem eles, publique à mão com scripts/empacotar-ptservidor.mjs.
      - name: Publicar na PTServidor (FTPS)
        if: env.ATALHO_HOSPEDAGEM == 'ptservidor' && env.FTP_SERVIDOR != ''
        env:
          FTP_UTILIZADOR: ${{ secrets.FTP_UTILIZADOR }}
          FTP_PALAVRA_PASSE: ${{ secrets.FTP_PALAVRA_PASSE }}
          FTP_PASTA: ${{ vars.FTP_PASTA || '/' }}
        run: |
          sudo apt-get install -y -qq lftp
          lftp -u "$FTP_UTILIZADOR,$FTP_PALAVRA_PASSE" -e "set ftp:ssl-force true; set ssl:verify-certificate true; mirror -R --delete --verbose=1 --exclude-glob .well-known/ dist $FTP_PASTA; quit" "$FTP_SERVIDOR"

      - name: Publicar na Cloudflare
        if: env.ATALHO_HOSPEDAGEM == 'cloudflare'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      # GitHub Pages: só quando é a hospedagem escolhida
      - uses: actions/configure-pages@v6
        if: env.ATALHO_HOSPEDAGEM == 'github'
      - uses: actions/upload-pages-artifact@v5
        if: env.ATALHO_HOSPEDAGEM == 'github'
        with:
          path: dist

      - id: publicacao
        if: env.ATALHO_HOSPEDAGEM == 'github'
        uses: actions/deploy-pages@v5
