# Gera o site (dist/) e publica no GitHub Pages.
# Roda a cada push na main e toda segunda-feira (para tirar do ar patrocínios vencidos).

name: Publicar site

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 10 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci

      - name: Testes (não publica nada quebrado)
        run: npm test

      - name: Gerar o site
        run: node scripts/gerar-site.mjs

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - id: publicacao
        uses: actions/deploy-pages@v5
