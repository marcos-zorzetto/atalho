<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tela de login · Exemplo do Atalho</title>
  <meta name="description" content="Exemplo de tela de login com duas colunas feita com o Atalho.">
  <!-- No seu projeto, troque "../atalho/" pelo CDN do Atalho -->
  <link rel="stylesheet" href="../atalho/atalho.css">
  <script src="../atalho/atalho.js" defer></script>
  <style>
    .tela { display: grid; min-height: 100dvh; }
    @media (min-width: 900px) { .tela { grid-template-columns: 1fr 1fr; } }
    .lado-marca { display: none; padding: 3rem; color: #fff; background: linear-gradient(160deg, #0f766e, #134e4a); }
    @media (min-width: 900px) { .lado-marca { display: flex; flex-direction: column; justify-content: space-between; } }
    .lado-form { display: grid; place-items: center; padding: 2rem 1rem; }
    .caixa { width: min(400px, 100%); }
    .divisor { display: flex; align-items: center; gap: .75rem; color: var(--at-texto-suave); font-size: var(--at-texto-xs); }
    .divisor::before, .divisor::after { content: ""; flex: 1; height: 1px; background: var(--at-borda); }
  </style>
</head>
<body>
  <main class="tela">
    <section class="lado-marca" aria-hidden="true">
      <strong style="font-size: 1.25rem">◆ Gestão</strong>
      <div>
        <p style="font-size: 1.75rem; font-weight: 700; line-height: 1.25">"Fechamos o mês em metade do tempo depois que tudo ficou num lugar só."</p>
        <p style="opacity: .8">Carla Mendes · Loja Sol</p>
      </div>
    </section>
    <section class="lado-form">
      <div class="caixa at-pilha">
        <div>
          <h1 class="at-titulo-3 at-mb-2">Entrar</h1>
          <p class="at-texto-suave at-mb-0">Não tem conta? <a href="#">Crie grátis</a></p>
        </div>
        <button class="at-botao at-bloco" type="button" data-at-notificar="Exemplo: aqui entraria o login com Google" data-at-tipo="info">Continuar com Google</button>
        <div class="divisor">ou com e-mail</div>
        <form class="at-pilha" id="form-login" data-at-validar>
          <div class="at-campo"><label class="at-rotulo" for="email">E-mail</label><input class="at-entrada" id="email" name="email" type="email" required autocomplete="username"></div>
          <div class="at-campo">
            <div class="at-linha at-entre"><label class="at-rotulo" for="senha">Senha</label><a href="#" class="at-texto-pequeno">Esqueci a senha</a></div>
            <div class="at-senha"><input class="at-entrada" id="senha" name="senha" type="password" required minlength="8" autocomplete="current-password"><button type="button" data-at-ver-senha>Mostrar</button></div>
          </div>
          <label class="at-check"><input type="checkbox" name="lembrar"> Manter conectado neste dispositivo</label>
          <button class="at-botao at-primario at-bloco at-grande">Entrar</button>
        </form>
        <p class="at-texto-suave at-texto-pequeno at-texto-centro">Protegido com verificação em duas etapas.</p>
      </div>
    </section>
  </main>
  <script>
    document.addEventListener("at:enviar", (evento) => {
      const { botao } = evento.detail;
      botao.setAttribute("aria-busy", "true");
      setTimeout(() => {
        botao.removeAttribute("aria-busy");
        Atalho.notificar("Exemplo: aqui você chamaria a sua API de login.", { titulo: "Dados válidos" });
      }, 900);
    });
  </script>
</body>
</html>
